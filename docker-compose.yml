services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  web:
    image: python:3.11-slim
    working_dir: /app
    command: python secure_gateway.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_storage: